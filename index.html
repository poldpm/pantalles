<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pantalles</title>
<link rel="icon" href="icona.svg" type="image/svg+xml">
<link rel="stylesheet" href="comu/marca.css">
<style>
  :root { --fons: #f5f6f8; --text: #1b1f27; --sub: #5a6272; --targeta: #fff; --vora: #e1e4ea; --accent: #821E34; }
  @media (prefers-color-scheme: dark) { :root { --fons: #101318; --text: #e9ecf1; --sub: #a4acba; --targeta: #191d24; --vora: #2c323d; --accent: #e0607a; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--fons); color: var(--text);
    font: 17px/1.4 "Titillium Web", "Segoe UI", sans-serif; padding: 24px 16px; box-sizing: border-box; }
  main { width: 100%; max-width: 560px; text-align: center; }
  img { width: 64px; height: 64px; }
  h1 { margin: 12px 0 4px; }
  p { color: var(--sub); margin: 0 0 24px; }
  .opcions { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  a { display: block; padding: 20px; border-radius: 0; border: 1px solid var(--vora); background: var(--targeta); color: var(--text); text-decoration: none; text-align: left; }
  a:hover { border-color: var(--accent); }
  a b { display: block; font-size: 18px; margin-bottom: 4px; }
  a span { color: var(--sub); font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="icona.svg" alt="">
  <h1>Pantalles</h1>
  <p>Pantalles informatives de l'escola</p>
  <div class="opcions">
    <a href="panell/"><b>⚙ Panell de control</b><span>Per a les persones que gestionen el contingut</span></a>
    <a href="pantalla/"><b>📺 Reproductor</b><span>Obre-ho a l'aparell connectat a la tele</span></a>
  </div>
</main>
</body>
</html>
