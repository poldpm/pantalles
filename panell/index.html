<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="robots" content="noindex">
<title>Panell de Pantalles</title>
<link rel="icon" href="../icona.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="../comu/diapos.css">
<link rel="stylesheet" href="panell.css">
</head>
<body>
<!-- Entrada -->
<section id="login" class="login" hidden>
  <div class="login-caixa">
    <div class="login-logo"><img src="../icona.svg" alt=""></div>
    <h1>Pantalles</h1>
    <p class="login-sub">Panell de control de les pantalles de l'escola</p>
    <form id="form-correu" class="login-form">
      <label for="correu">Correu de l'escola</label>
      <input id="correu" type="email" autocomplete="email" inputmode="email" placeholder="nom@escola.cat" required>
      <button class="btn primari gran" type="submit">Envia'm un codi</button>
    </form>
    <form id="form-codi" class="login-form" hidden>
      <p class="login-info">Hem enviat un codi de 6 xifres a <b id="correu-enviat"></b>. Mira també el correu brossa.</p>
      <label for="codi">Codi</label>
      <input id="codi" class="input-codi" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000" required>
      <button class="btn primari gran" type="submit">Entra</button>
      <button class="btn enllac" type="button" id="torna-correu">Canviar de correu o tornar a enviar</button>
    </form>
    <p id="login-error" class="login-error" role="alert"></p>
  </div>
  <p class="login-peu">Només hi poden entrar les persones autoritzades.</p>
</section>

<!-- Aplicació -->
<div id="app" class="app" hidden>
  <nav class="menu" id="menu">
    <a class="menu-marca" href="#inici"><img src="../icona.svg" alt=""><span>Pantalles</span></a>
    <a href="#inici" data-sec="inici"><span class="ic">⌂</span><span>Inici</span></a>
    <a href="#pantalles" data-sec="pantalles"><span class="ic">▭</span><span>Pantalles</span></a>
    <a href="#llistes" data-sec="llistes"><span class="ic">☰</span><span>Llistes</span></a>
    <a href="#biblioteca" data-sec="biblioteca"><span class="ic">▦</span><span>Biblioteca</span></a>
    <a href="#avisos" data-sec="avisos"><span class="ic">⚠</span><span>Avisos</span></a>
    <a href="#ajustos" data-sec="ajustos"><span class="ic">⚙</span><span>Ajustos</span></a>
  </nav>
  <div class="principal">
    <header class="barra">
      <div class="barra-titol" id="barra-titol"></div>
      <div class="barra-dreta">
        <span id="indicador" class="indicador" title="Estat de la connexió"></span>
        <button class="usuari" id="boto-usuari" type="button" aria-haspopup="true"></button>
      </div>
    </header>
    <main id="vista" class="vista" tabindex="-1"></main>
  </div>
</div>

<div id="carregant" class="carregant"><div class="roda"></div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="capa-modal" class="capa-modal" hidden></div>

<script src="../config.js"></script>
<script src="../comu/api.js"></script>
<script src="../comu/diapos.js"></script>
<script src="panell.js"></script>
</body>
</html>
