<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pantalla</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icona.svg" type="image/svg+xml">
<link rel="stylesheet" href="../comu/marca.css">
<style>
  /* Capa exterior: és la que es posa en pantalla completa i no es recarrega mai.
     El reproductor de veritat va a dins (reproductor.html) i es pot actualitzar sense perdre-la. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body.sense-cursor, body.sense-cursor * { cursor: none !important; }
  #reproductor { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; background: #000; }
  #pista { position: fixed; left: 50%; bottom: 13vmin; transform: translateX(-50%); z-index: 10; font-family: "Titillium Web", "Segoe UI", sans-serif;
    font-weight: 600; font-size: 2.8vmin; color: #fff; background: #2D2926; border-left: .84vmin solid #FF004E; padding: 1.9vmin 3.9vmin; white-space: nowrap; }
  #pista[hidden] { display: none; }
</style>
</head>
<body>
<iframe id="reproductor" title="Pantalla" allow="autoplay; fullscreen; encrypted-media; screen-wake-lock"></iframe>
<div id="pista" hidden>Prem qualsevol botó per posar la pantalla completa</div>
<script src="capa.js"></script>
</body>
</html>
